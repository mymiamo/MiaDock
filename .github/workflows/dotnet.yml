name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: windows-latest
    timeout-minutes: 30

    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      DOTNET_NOLOGO: "1"

    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore MiaDock.sln

      - name: Build application
        run: dotnet build src/MiaDock.App/MiaDock.App.csproj -c Release -p:Platform=x64 --no-restore -m:1

      - name: Test core
        run: dotnet test tests/MiaDock.Core.Tests/MiaDock.Core.Tests.csproj -c Release --no-restore -m:1

      - name: Test Windows platform
        run: dotnet test tests/MiaDock.Platform.Windows.Tests/MiaDock.Platform.Windows.Tests.csproj -c Release -p:Platform=x64 --no-restore -m:1

      - name: Test WinUI resources
        run: dotnet test tests/MiaDock.WinUI.Tests/MiaDock.WinUI.Tests.csproj -c Release -p:Platform=x64 --no-restore -m:1
